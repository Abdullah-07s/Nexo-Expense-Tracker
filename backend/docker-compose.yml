services:
  postgres:
    image: postgres:16
    container_name: nexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - nexo_pg_data:/var/lib/postgresql/data

volumes:
  nexo_pg_data:
